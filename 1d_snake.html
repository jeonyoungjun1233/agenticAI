<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1D 지렁이 게임</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
        }
        #game-container {
            display: flex;
            gap: 2px;
            margin-bottom: 20px;
            padding: 10px;
            background: #333;
            border-radius: 8px;
        }
        .cell {
            width: 30px;
            height: 30px;
            background-color: #444;
            border-radius: 4px;
        }
        .snake {
            background-color: #4caf50;
        }
        .head {
            background-color: #81c784;
        }
        .food {
            background-color: #f44336;
            border-radius: 50%;
            transform: scale(0.8);
        }
        #message {
            font-size: 24px;
            font-weight: bold;
            height: 30px;
            margin-bottom: 10px;
        }
        p {
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>1D 지렁이 게임</h1>
    <div id="message"></div>
    <div id="game-container"></div>
    <p>조작: ← (왼쪽), → (오른쪽)</p>
    <p>스페이스바로 재시작</p>

    <script>
        const SIZE = 20; // 1차원 맵의 크기
        let snake = [5];
        let direction = 1; // 1: 오른쪽, -1: 왼쪽
        let nextDirection = 1;
        let food = 15;
        let gameInterval;
        let isGameOver = false;

        const container = document.getElementById('game-container');
        const messageEl = document.getElementById('message');

        function init() {
            container.innerHTML = '';
            for (let i = 0; i < SIZE; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.id = `cell-${i}`;
                container.appendChild(cell);
            }
        }

        function placeFood() {
            const availableCells = [];
            for (let i = 0; i < SIZE; i++) {
                if (!snake.includes(i)) {
                    availableCells.push(i);
                }
            }
            if (availableCells.length === 0) {
                winGame();
                return;
            }
            food = availableCells[Math.floor(Math.random() * availableCells.length)];
        }

        function draw() {
            for (let i = 0; i < SIZE; i++) {
                const cell = document.getElementById(`cell-${i}`);
                cell.className = 'cell';
                if (i === food) {
                    cell.classList.add('food');
                }
                if (snake.includes(i)) {
                    cell.classList.add('snake');
                    if (i === snake[0]) {
                        cell.classList.add('head'); // 머리는 조금 더 밝게
                    }
                }
            }
        }

        function update() {
            if (isGameOver) return;

            direction = nextDirection;
            const head = snake[0];
            const nextHead = head + direction;

            // 벽에 부딪히면 게임오버
            if (nextHead < 0 || nextHead >= SIZE) {
                gameOver();
                return;
            }

            // 자신의 몸에 부딪히면 게임오버 (1차원에서는 후진하면 부딪히게 됨)
            if (snake.includes(nextHead)) {
               gameOver();
               return;
            }

            snake.unshift(nextHead); // 머리 이동

            if (nextHead === food) {
                placeFood(); // 먹이 먹음
            } else {
                snake.pop(); // 꼬리 자르기
            }

            draw();
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameInterval);
            messageEl.textContent = '게임 오버! (스페이스바로 재시작)';
            messageEl.style.color = '#f44336';
        }

        function winGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            messageEl.textContent = '승리!';
            messageEl.style.color = '#4caf50';
        }

        function startGame() {
            snake = [5];
            direction = 1;
            nextDirection = 1;
            isGameOver = false;
            messageEl.textContent = '';
            placeFood();
            init();
            draw();
            clearInterval(gameInterval);
            gameInterval = setInterval(update, 300); // 0.3초마다 이동
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                // 몸통이 2개 이상일 때 반대 방향으로 이동 불가능하게
                if (direction !== 1 || snake.length === 1) nextDirection = -1;
            } else if (e.key === 'ArrowRight') {
                if (direction !== -1 || snake.length === 1) nextDirection = 1;
            } else if (e.key === ' ' || e.key === 'Spacebar') {
                if (isGameOver) startGame();
            }
        });

        startGame();
    </script>
</body>
</html>
